<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000d1f"/>
      <stop offset="100%" style="stop-color:#001433"/>
    </linearGradient>

    <!-- Text glow -->
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Flag glow -->
    <filter id="flagGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Border glow -->
    <filter id="borderGlow" x="-2%" y="-2%" width="104%" height="104%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Shimmer gradient -->
    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7"/>
      <stop offset="40%" style="stop-color:#81d4fa"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="60%" style="stop-color:#81d4fa"/>
      <stop offset="100%" style="stop-color:#4fc3f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="subShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5ff"/>
      <stop offset="50%" style="stop-color:#80ffff"/>
      <stop offset="100%" style="stop-color:#00e5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="flagShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.08)"/>
    </linearGradient>

    <!-- Hex pattern -->
    <pattern id="hexGrid" x="0" y="0" width="24" height="20" patternUnits="userSpaceOnUse">
      <polygon points="12,1 22,6 22,14 12,19 2,14 2,6" fill="none" stroke="rgba(100,180,255,0.06)" stroke-width="0.5"/>
    </pattern>

    <clipPath id="cardClip"><rect width="420" height="120" rx="12"/></clipPath>

    <radialGradient id="leftAtmo" cx="0%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,100,220,0.2)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="rightAtmo" cx="100%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:rgba(0,200,255,0.1)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="120" rx="12" fill="url(#bgGrad)"/>
  <rect width="420" height="120" rx="12" fill="url(#hexGrid)" clip-path="url(#cardClip)"/>
  <rect width="420" height="120" rx="12" fill="url(#leftAtmo)" clip-path="url(#cardClip)"/>
  <rect width="420" height="120" rx="12" fill="url(#rightAtmo)" clip-path="url(#cardClip)"/>

  <!-- Stars in background -->
  <circle cx="340" cy="15" r="1" fill="white" opacity="0.4"/>

  <circle cx="370" cy="30" r="0.8" fill="white" opacity="0.3"/>
  <circle cx="390" cy="12" r="1.2" fill="white" opacity="0.35"/>
  <circle cx="355" cy="45" r="0.7" fill="white" opacity="0.25"/>
  <circle cx="405" cy="55" r="1" fill="white" opacity="0.3"/>
  <circle cx="380" cy="70" r="0.8" fill="white" opacity="0.2"/>
  <circle cx="410" cy="90" r="1" fill="white" opacity="0.25"/>
  <circle cx="345" cy="95" r="0.7" fill="white" opacity="0.2"/>

  <!-- Glowing border -->
  <rect width="418" height="118" x="1" y="1" rx="11" fill="none" stroke="rgba(0,180,255,0.65)" stroke-width="1" filter="url(#borderGlow)"/>
  <rect width="416" height="116" x="2" y="2" rx="10" fill="none" stroke="rgba(0,150,255,0.15)" stroke-width="1"/>

  <!-- Corner accents -->
  <polyline points="14,2 2,2 2,14" fill="none" stroke="#00ccff" stroke-width="1.8" opacity="0.9"/>
  <polyline points="406,2 418,2 418,14" fill="none" stroke="#00ccff" stroke-width="1.8" opacity="0.9"/>
  <polyline points="14,118 2,118 2,104" fill="none" stroke="#00ccff" stroke-width="1.8" opacity="0.9"/>
  <polyline points="406,118 418,118 418,104" fill="none" stroke="#00ccff" stroke-width="1.8" opacity="0.9"/>

  <!-- Somali Flag -->
  <g transform="translate(14, 24)" filter="url(#flagGlow)">
    <rect width="72" height="48" rx="4" fill="rgba(65,137,221,0.15)"/>
    <rect width="72" height="48" rx="4" fill="#4189DD"/>
    <rect width="72" height="48" rx="4" fill="url(#flagShine)"/>
    <g transform="translate(36, 24)" filter="url(#starGlow)">
      <polygon points="0,-13 3,-4 12,-4 5,2 8,11 0,6 -8,11 -5,2 -12,-4 -3,-4" fill="white" opacity="0.2"/>
      <polygon points="0,-12 2.7,-3.7 11,-3.7 4.5,2 7,10 0,5.5 -7,10 -4.5,2 -11,-3.7 -2.7,-3.7" fill="white" opacity="1"/>
    </g>
  </g>
  <rect x="13" y="23" width="74" height="50" rx="5" fill="none" stroke="rgba(65,137,221,0.55)" stroke-width="1.2"/>

  <!-- Divider line -->
  <line x1="100" y1="18" x2="100" y2="102" stroke="rgba(0,150,255,0.25)" stroke-width="1"/>

  <!-- Text block -->
  <text x="114" y="46" fill="rgba(0,200,255,0.6)" font-size="15"
        font-family="'Courier New', monospace" letter-spacing="2">
    QQQ@kali:~#
  </text>

  <text x="114" y="74" fill="url(#titleShimmer)" font-size="22"
        font-family="'Courier New', monospace" font-weight="bold"
        letter-spacing="1" filter="url(#textGlow)">
    Cyber-in-Somali
  </text>

  <text x="114" y="94" fill="url(#subShimmer)" font-size="11"
        font-family="'Courier New', monospace" letter-spacing="2.5">
    BINARY · CTF · SOMALI
  </text>

  <!-- Bottom accent line -->
  <line x1="114" y1="103" x2="400" y2="103" stroke="rgba(0,150,255,0.2)" stroke-width="0.8"/>
</svg>